<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <rect width="1200" height="600" fill="#020617" />
  <!-- Top Alert: FAT32 4GB Limit Error -->
  <rect x="24" y="24" width="1152" height="78" rx="10" fill="#4C0519" fill-opacity="0.45" stroke="#F43F5E" />
  <text x="52" y="50" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✕ Operación de Escritura Rechazada por el Sistema de Archivos (FAT32)</text>
  <text x="52" y="72" fill="#FFE4E6" font-family="system-ui, sans-serif" font-size="12">LÍMITE DE TAMAÑO DE ARCHIVO EN FAT32 SUPERADO: El archivo "ubuntu_24_04_desktop_amd64.iso" mide 4.70 GB, pero FAT32 utiliza un campo</text>
  <text x="52" y="90" fill="#FFE4E6" font-family="system-ui, sans-serif" font-size="12">de 32 bits que impone un límite estricto de 4 GB menos 1 byte (4,294,967,295 B). Formatea el volumen en NTFS, exFAT o ext4.</text>

  <!-- Main Cluster Comparison Panel -->
  <rect x="24" y="120" width="1152" height="456" rx="12" fill="#0F172A" stroke="#1E293B" />
  <text x="48" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Anatomía Física de Asignación de Clústeres — Lote: telemetria_sensores_10k.json (10,000 × 1.20 KB)</text>

  <!-- 4 Metric Boxes -->
  <rect x="48" y="174" width="260" height="74" rx="8" fill="#020617" stroke="#1E293B" />
  <text x="64" y="196" fill="#94A3B8" font-family="monospace" font-size="11">Tamaño Lógico Real</text>
