  <text x="64" y="238" fill="#64748B" font-family="monospace" font-size="10">10,000 archivos de 1.20 KB</text>

  <rect x="328" y="174" width="260" height="74" rx="8" fill="#020617" stroke="#1E293B" />
  <text x="344" y="196" fill="#94A3B8" font-family="monospace" font-size="11">Clústeres Ocupados (64 KB)</text>
  <text x="344" y="220" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">10,000 clústeres</text>
  <text x="344" y="238" fill="#64748B" font-family="monospace" font-size="10">1 clúster indivisible / archivo</text>

  <rect x="608" y="174" width="260" height="74" rx="8" fill="#020617" stroke="#1E293B" />
  <text x="624" y="196" fill="#94A3B8" font-family="monospace" font-size="11">Tamaño Físico en Disco</text>
  <text x="624" y="220" fill="#34D399" font-family="monospace" font-size="16" font-weight="700">625.00 MB</text>
  <text x="624" y="238" fill="#F43F5E" font-family="monospace" font-size="10">Eficiencia: 1.9%</text>

  <rect x="888" y="174" width="264" height="74" rx="8" fill="#020617" stroke="#1E293B" />
  <text x="904" y="196" fill="#94A3B8" font-family="monospace" font-size="11">Slack Space Desperdiciado</text>
  <text x="904" y="220" fill="#FBBF24" font-family="monospace" font-size="16" font-weight="700">613.28 MB</text>
  <text x="904" y="238" fill="#64748B" font-family="monospace" font-size="10">62.80 KB perdidos / archivo</text>

  <!-- Visual Cluster Bar -->
  <rect x="48" y="266" width="1104" height="44" rx="8" fill="#020617" stroke="#334155" />
  <rect x="48" y="266" width="120" height="44" rx="8" fill="#0284C7" />
  <text x="62" y="293" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Datos (2%)</text>
  <rect x="168" y="266" width="984" height="44" rx="8" fill="#78350F" fill-opacity="0.35" />
  <text x="460" y="293" fill="#FDE68A" font-family="monospace" font-size="12" font-weight="700">Slack Space Desperdiciado por Fragmentación Interna (98%)</text>

  <!-- Table Comparison -->
  <text x="48" y="342" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Comparativa Matemática según Tamaño de Clúster (Unidad de Asignación)</text>
  <line x1="48" y1="354" x2="1152" y2="354" stroke="#1E293B" />

  <text x="58" y="378" fill="#38BDF8" font-family="monospace" font-size="12">512 B (Sector)</text>
  <text x="260" y="378" fill="#E2E8F0" font-family="monospace" font-size="12">30,000 clústeres</text>
  <text x="460" y="378" fill="#E2E8F0" font-family="monospace" font-size="12">Ocupado: 14.65 MB</text>
  <text x="660" y="378" fill="#FBBF24" font-family="monospace" font-size="12">Slack: 2.93 MB</text>
  <text x="850" y="378" fill="#34D399" font-family="monospace" font-size="12">Eficiencia: 80.0%</text>

  <text x="58" y="410" fill="#38BDF8" font-family="monospace" font-size="12">4 KB (Estándar)</text>
  <text x="260" y="410" fill="#E2E8F0" font-family="monospace" font-size="12">10,000 clústeres</text>
  <text x="460" y="410" fill="#E2E8F0" font-family="monospace" font-size="12">Ocupado: 39.06 MB</text>
  <text x="660" y="410" fill="#FBBF24" font-family="monospace" font-size="12">Slack: 27.34 MB</text>
  <text x="850" y="410" fill="#FBBF24" font-family="monospace" font-size="12">Eficiencia: 30.0%</text>

  <rect x="48" y="424" width="1104" height="32" rx="6" fill="#0284C7" fill-opacity="0.18" />
  <text x="58" y="445" fill="#7DD3FC" font-family="monospace" font-size="12" font-weight="700">64 KB (Multimedia)</text>
  <text x="260" y="445" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">10,000 clústeres</text>
  <text x="460" y="445" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Ocupado: 625.00 MB</text>
  <text x="660" y="445" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">Slack: 613.28 MB</text>
  <text x="850" y="445" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">Eficiencia: 1.9%</text>

  <!-- NTFS MFT Resident Note -->
  <rect x="48" y="476" width="1104" height="74" rx="8" fill="#064E3B" fill-opacity="0.25" stroke="#10B981" />
  <text x="68" y="502" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Optimización NTFS: Archivos Residentes en la Master File Table (MFT &le; 700 B)</text>
  <text x="68" y="526" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">En NTFS los microarchivos (&le;700 B) se guardan directamente en el atributo $DATA del registro MFT de 1 KB: 0 clústeres de datos y 0 B de Slack Space.</text>
</svg>
