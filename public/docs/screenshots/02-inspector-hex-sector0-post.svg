<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" fill="none">
  <rect width="1200" height="620" fill="#020617" />
  <!-- Left Panel: Sector 0 Hex Inspector -->
  <rect x="24" y="24" width="670" height="572" rx="12" fill="#0F172A" stroke="#1E293B" />
  <text x="48" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Estructura Física del Sector 0 (LBA 0) — Master Boot Record (512 Bytes)</text>
  <text x="48" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">440B Código de Arranque + 4B Firma Disco + 64B Tabla 4 Entradas (4×16B) + 2B Firma 0x55AA</text>

  <!-- Block 1: Bootstrap -->
  <rect x="48" y="96" width="622" height="84" rx="8" fill="#020617" stroke="#0284C7" stroke-opacity="0.5" />
  <text x="64" y="118" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Bootstrap Code Area (Código Maestro de Arranque)</text>
  <text x="470" y="118" fill="#94A3B8" font-family="monospace" font-size="11">Offset: 0x000 - 0x1B7 (440B)</text>
  <text x="64" y="142" fill="#38BDF8" font-family="monospace" font-size="12">33 C0 8E D0 BC 00 7C 8E C0 8E D8 BE 00 7C BF 00 06 B9 00 02 FC F3 A4 ...</text>
  <text x="64" y="164" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Instrucciones máquina x86 (16-bit Real Mode) que escanean la tabla buscando el flag 0x80.</text>

  <!-- Block 2: MBR Entry #1 Active -->
  <rect x="48" y="192" width="622" height="92" rx="8" fill="#064E3B" fill-opacity="0.25" stroke="#10B981" />
  <text x="64" y="214" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Entrada MBR #1: Partición 1 (PRIMARY — ACTIVA)</text>
  <text x="470" y="214" fill="#A7F3D0" font-family="monospace" font-size="11">Offset: 0x1BE - 0x1CD (16B)</text>
  <text x="64" y="240" fill="#6EE7B7" font-family="monospace" font-size="13" font-weight="700">80 20 21 00 07 FE FF FF 00 08 00 00 00 00 20 00</text>
  <text x="64" y="266" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Flag Arranque: 0x80 (ACTIVA) · Tipo ID: 0x07 (NTFS/exFAT) · LBA 32-bit LE: 2,097,152 sectores</text>

  <!-- Block 3: MBR Entry #2 Extended -->
  <rect x="48" y="296" width="622" height="92" rx="8" fill="#1E1B4B" fill-opacity="0.4" stroke="#818CF8" />
  <text x="64" y="318" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Entrada MBR #2: Partición 2 (EXTENDED — Contenedor EBR)</text>
  <text x="470" y="318" fill="#C7D2FE" font-family="monospace" font-size="11">Offset: 0x1CE - 0x1DD (16B)</text>
  <text x="64" y="344" fill="#A5B4FC" font-family="monospace" font-size="13" font-weight="700">00 FE FF FF 0F FE FF FF 00 08 20 00 00 00 64 00</text>
  <text x="64" y="370" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Flag Arranque: 0x00 (Inactiva) · Tipo ID: 0x0F (Extendida LBA) · Aloja Unidades Lógicas</text>

  <!-- Block 4: Magic Signature -->
  <rect x="48" y="400" width="622" height="84" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" />
  <text x="64" y="422" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700">Magic Boot Signature (Firma de Sector de Arranque Válido)</text>
  <text x="470" y="422" fill="#A7F3D0" font-family="monospace" font-size="11">Offset: 0x1FE - 0x1FF (2B)</text>
  <text x="64" y="448" fill="#34D399" font-family="monospace" font-size="14" font-weight="700">55 AA</text>
  <text x="64" y="470" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Bytes 510 y 511 obligatorios (0x55AA). Sin ellos la BIOS/UEFI rechaza el sector.</text>

  <!-- Right Panel: POST Boot Emulator -->
  <rect x="714" y="24" width="462" height="572" rx="12" fill="#0F172A" stroke="#1E293B" />
  <text x="738" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Emulador de Secuencia de Arranque (POST)</text>
  <text x="738" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Simulación paso a paso del encendido de placa base</text>

  <!-- Monitor Screen -->
  <rect x="738" y="96" width="414" height="468" rx="10" fill="#000000" stroke="#334155" stroke-width="2" />
  <text x="758" y="124" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">FIRMWARE: BIOS Legacy INT 13h (16-bit) · /dev/sda</text>
  <line x1="758" y1="136" x2="1132" y2="136" stroke="#1E293B" />

  <text x="758" y="164" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700">Windows Boot Manager (BOOTMGR — Legacy BIOS)</text>

  <text x="758" y="204" fill="#CBD5E1" font-family="monospace" font-size="11">[Paso 1] BIOS INT 13h -&gt; LBA 0 (MBR 440B Bootstrap)</text>
  <text x="758" y="222" fill="#CBD5E1" font-family="monospace" font-size="11">         cargado en 0x0000:0x7C00... OK</text>

  <text x="758" y="262" fill="#CBD5E1" font-family="monospace" font-size="11">[Paso 2] Entrada #1 verificada con Flag 0x80 (Activa).</text>
  <text x="758" y="280" fill="#CBD5E1" font-family="monospace" font-size="11">         Saltando al VBR (NTFS)... OK</text>

  <text x="758" y="320" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">[Paso 3] VBR NTFS -&gt; Cargando BOOTMGR y base BCD -&gt;</text>
  <text x="758" y="338" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">         Iniciando winload.exe... SISTEMA INICIADO.</text>

  <line x1="758" y1="516" x2="1132" y2="516" stroke="#1E293B" />
  <text x="758" y="542" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">✓ ARRANQUE EXITOSO EN BIOS + MBR (Signature: 0x55AA)</text>
</svg>
