<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#020617" />
  <!-- Top Bar -->
  <rect width="1200" height="54" fill="#090D16" />
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#1E293B" stroke-width="1" />
  <circle cx="34" cy="27" r="14" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5" />
  <text x="58" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Simulador DiskPart &amp; Sistemas de Archivos — Un Fantasma en el Sistema</text>
  <text x="580" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Discos y CLI</text>
  <text x="685" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Sector 0 Hex &amp; Boot POST</text>
  <text x="865" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Simulador Clústeres</text>
  <text x="1005" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Retos Prácticos (5)</text>

  <!-- Hardware & Firmware Selection Strip -->
  <rect x="24" y="72" width="1152" height="58" rx="10" fill="#0F172A" stroke="#1E293B" />
  <rect x="130" y="81" width="195" height="40" rx="7" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" />
  <text x="144" y="99" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Disco 0 (/dev/nvme0n1) · 500 GB</text>
  <text x="144" y="114" fill="#7DD3FC" font-family="monospace" font-size="10">Tabla: GPT · 3 particiones</text>

  <rect x="335" y="81" width="185" height="40" rx="7" fill="#020617" stroke="#1E293B" />
  <text x="348" y="99" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Disco 1 (/dev/sda) · 4.00 TB</text>
  <text x="348" y="114" fill="#64748B" font-family="monospace" font-size="10">Tabla: MBR · Barrera 2 TB</text>

  <rect x="530" y="81" width="180" height="40" rx="7" fill="#020617" stroke="#1E293B" />
  <text x="544" y="99" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Disco 2 (/dev/sdb) · 32 GB</text>
  <text x="544" y="114" fill="#64748B" font-family="monospace" font-size="10">Tabla: MBR · FAT32 USB</text>

  <rect x="855" y="85" width="115" height="32" rx="6" fill="#065F46" fill-opacity="0.35" stroke="#10B981" />
  <text x="875" y="105" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UEFI Moderno</text>
  <rect x="980" y="85" width="90" height="32" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" />
  <text x="995" y="105" fill="#E0F2FE" font-family="monospace" font-size="11" font-weight="700">GPT (64-bit)</text>
  <rect x="1080" y="85" width="82" height="32" rx="6" fill="#4C0519" fill-opacity="0.4" stroke="#F43F5E" />
  <text x="1095" y="105" fill="#FECDD3" font-family="monospace" font-size="11">CLEAN</text>

  <!-- Boot Diagnostic Banner -->
  <rect x="24" y="144" width="1152" height="68" rx="10" fill="#064E3B" fill-opacity="0.22" stroke="#059669" />
  <text x="52" y="166" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">DIAGNÓSTICO DE ARRANQUE (UEFI + GPT) · ESTADO: APTO PARA ARRANQUE</text>
  <text x="52" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Arquitectura UEFI + GPT Dual-Boot (Windows NTFS + Linux ext4) Óptima</text>
  <text x="52" y="202" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">UEFI monta la Partición EFI #1 (300 MB, FAT32) y ejecuta el cargador .efi registrado en NVRAM.</text>

  <!-- Visual GParted Block Map -->
  <rect x="24" y="226" width="1152" height="205" rx="10" fill="#0F172A" stroke="#1E293B" />
  <text x="44" y="254" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Disco 0 (/dev/nvme0n1): NVMe SSD Kingston KC3000 500 GB</text>
  <text x="490" y="254" fill="#94A3B8" font-family="monospace" font-size="12">· NVMe PCIe 4.0 · Sector 512B</text>

  <!-- Blocks inside Map -->
  <!-- LBA 0 GPT Primary -->
  <rect x="44" y="272" width="64" height="108" rx="7" fill="#020617" stroke="#334155" />
  <text x="58" y="294" fill="#94A3B8" font-family="monospace" font-size="10">LBA 0..33</text>
  <text x="56" y="330" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">GPT 1ª</text>
  <text x="58" y="365" fill="#64748B" font-family="monospace" font-size="10">17 KB</text>

  <!-- Partition 1: EFI ESP FAT32 -->
  <rect x="116" y="272" width="165" height="108" rx="7" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" />
  <rect x="116" y="272" width="165" height="7" fill="#10B981" />
  <text x="128" y="298" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="700">EFI ESP · FAT32</text>
  <text x="128" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">S: EFI-SYSTEM</text>
  <text x="128" y="366" fill="#CBD5E1" font-family="monospace" font-size="11">300 MB · Clúster 4KB</text>

  <!-- Partition 2: MSR -->
  <rect x="289" y="272" width="95" height="108" rx="7" fill="#1E293B" stroke="#475569" />
  <rect x="289" y="272" width="95" height="7" fill="#94A3B8" />
  <text x="300" y="298" fill="#CBD5E1" font-family="monospace" font-size="11" font-weight="700">MSR · RAW</text>
  <text x="300" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Reservado</text>
  <text x="300" y="366" fill="#94A3B8" font-family="monospace" font-size="11">16 MB</text>

  <!-- Partition 3: Windows NTFS -->
  <rect x="392" y="272" width="310" height="108" rx="7" fill="#0C4A6E" fill-opacity="0.4" stroke="#38BDF8" stroke-width="2" />
  <rect x="392" y="272" width="310" height="7" fill="#0EA5E9" />
  <text x="406" y="298" fill="#7DD3FC" font-family="monospace" font-size="11" font-weight="700">/dev/nvme0n1p3 · NTFS</text>
  <text x="406" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">C: Sistema-Win11</text>
  <rect x="406" y="342" width="280" height="6" rx="3" fill="#020617" />
  <rect x="406" y="342" width="110" height="6" rx="3" fill="#0EA5E9" />
  <text x="406" y="366" fill="#E2E8F0" font-family="monospace" font-size="11">200.0 GB · Clúster 4KB (4096 B)</text>

  <!-- Partition 4: Linux ext4 -->
  <rect x="710" y="272" width="265" height="108" rx="7" fill="#78350F" fill-opacity="0.35" stroke="#F59E0B" />
  <rect x="710" y="272" width="265" height="7" fill="#F59E0B" />
  <text x="724" y="298" fill="#FDE68A" font-family="monospace" font-size="11" font-weight="700">/dev/nvme0n1p4 · ext4</text>
  <text x="724" y="318" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">/ Linux-Root</text>
  <text x="724" y="366" fill="#E2E8F0" font-family="monospace" font-size="11">150.0 GB · Bloque 4KB</text>

  <!-- Unallocated -->
  <rect x="983" y="272" width="105" height="108" rx="7" fill="#020617" stroke="#334155" stroke-dasharray="4 4" />
  <text x="995" y="298" fill="#94A3B8" font-family="monospace" font-size="10">NO ASIGNADO</text>
  <text x="995" y="320" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">149.7 GB</text>
  <text x="995" y="366" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11">+ Crear Part.</text>

  <!-- LBA End GPT Backup -->
  <rect x="1096" y="272" width="60" height="108" rx="7" fill="#020617" stroke="#334155" />
  <text x="1106" y="294" fill="#94A3B8" font-family="monospace" font-size="10">LBA Fin</text>
  <text x="1105" y="330" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">GPT 2ª</text>
  <text x="1107" y="365" fill="#64748B" font-family="monospace" font-size="10">Backup</text>

  <!-- Console Terminal Bottom -->
  <rect x="24" y="445" width="1152" height="206" rx="10" fill="#020617" stroke="#1E293B" />
  <rect x="24" y="445" width="1152" height="36" rx="10" fill="#0F172A" />
  <text x="48" y="468" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">DISKPART.EXE / PARTED CLI — Consola Dual Sincronizada (Windows + Linux)</text>

  <text x="44" y="504" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">DISKPART&gt; create partition efi size=300</text>
  <text x="360" y="504" fill="#FCD34D" font-family="monospace" font-size="11">[Linux: # parted /dev/nvme0n1 mkpart efi 1MiB 301MiB]</text>
  <text x="58" y="524" fill="#6EE7B7" font-family="monospace" font-size="12">DiskPart ha creado satisfactoriamente la partición especificada (EFI de 300 MB).</text>

  <text x="44" y="552" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">DISKPART&gt; format fs=ntfs unit=4096 label="Sistema-Win11" quick</text>
  <text x="515" y="552" fill="#FCD34D" font-family="monospace" font-size="11">[Linux: # mkfs.ntfs -c 4096 -L "Sistema-Win11" -Q /dev/nvme0n1p3]</text>
  <text x="58" y="572" fill="#6EE7B7" font-family="monospace" font-size="12">100 por ciento completado. DiskPart formateó el volumen correctamente en NTFS (Clúster: 4096 bytes).</text>

  <rect x="24" y="612" width="1152" height="39" fill="#0F172A" />
  <text x="44" y="636" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">DISKPART&gt;</text>
  <text x="122" y="636" fill="#94A3B8" font-family="monospace" font-size="12">list partition_</text>
</svg>
